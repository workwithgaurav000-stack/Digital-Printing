<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Smart Print Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Real-time Updates via Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    
    <!-- Top Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800 border border-slate-700 p-5 rounded-2xl mb-6 shadow-lg gap-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-blue-600/20 text-blue-400 rounded-xl flex items-center justify-center text-2xl">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Smart Print - Admin Panel</h1>
          <p class="text-xs text-slate-400">सभी प्रिंट रिक्वेस्ट और डायरेक्ट प्रिंटिंग कंट्रोल 🖨️</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Server Live
        </span>
        <button onclick="fetchOrders()" class="px-3.5 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-xl transition-all flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> रिफ्रेश
        </button>
      </div>
    </header>

    <!-- Orders Grid / List -->
    <main>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">हालिया ऑर्डर्स (<span id="orderCount">0</span>)</h2>
      </div>

      <div id="ordersContainer" class="space-y-4">
        <!-- Orders will load dynamically here -->
        <div class="text-center py-12 bg-slate-800/50 rounded-2xl border border-slate-700/50 text-slate-400">
          <i class="fa-solid fa-spinner animate-spin text-2xl text-blue-500 mb-2"></i>
          <p class="text-sm">ऑर्डर्स लोड हो रहे हैं...</p>
        </div>
      </div>
    </main>

  </div>

  <script>
    const socket = io();
    let allOrders = [];

    // Load initial orders
    async function fetchOrders() {
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (data.success) {
          allOrders = data.orders;
          renderOrders(allOrders);
        }
      } catch (err) {
        console.error("Error fetching orders:", err);
      }
    }

    // Render Orders in Admin Interface
    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      document.getElementById('orderCount').innerText = orders.length;

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-slate-800/40 rounded-2xl border border-slate-700/50 text-slate-400">
            <i class="fa-solid fa-inbox text-4xl mb-3 text-slate-600"></i>
            <p class="text-sm">अभी कोई नया प्रिंट ऑर्डर उपलब्ध नहीं है।</p>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(order => {
        const filesList = order.files && order.files.length > 0 ? order.files : [{ originalName: order.fileName, filePath: order.filePath }];
        const isPrinted = order.status === 'Printed';

        return `
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md flex flex-col md:flex-row justify-between gap-5 items-start md:items-center">
            
            <!-- Order Details -->
            <div class="space-y-2 flex-1">
              <div class="flex items-center gap-3 flex-wrap">
                <span class="text-xs font-mono font-bold bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-lg border border-blue-500/30">
                  ${order.orderId}
                </span>
                <h3 class="text-base font-bold text-white">${order.customerName}</h3>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${isPrinted ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                  ${isPrinted ? '<i class="fa-solid fa-circle-check"></i> प्रिंटेड' : '<i class="fa-solid fa-clock"></i> पेंडिंग'}
                </span>
              </div>

              <!-- Options Badge -->
              <div class="flex flex-wrap items-center gap-2 text-xs text-slate-300">
                <span class="bg-slate-700/80 px-2.5 py-1 rounded-md border border-slate-600">
                  <i class="fa-solid fa-palette text-blue-400"></i> ${order.printType === 'BW' ? 'B&W (₹2/पेज)' : 'Color (₹10/पेज)'}
                </span>
                <span class="bg-slate-700/80 px-2.5 py-1 rounded-md border border-slate-600">
                  <i class="fa-solid fa-file-lines text-indigo-400"></i> ${order.sides} Sided
                </span>
                <span class="bg-slate-700/80 px-2.5 py-1 rounded-md border border-slate-600">
                  <i class="fa-solid fa-copy text-amber-400"></i> ${order.copies} कॉपी
                </span>
                <span class="bg-slate-700/80 px-2.5 py-1 rounded-md border border-slate-600">
                  <i class="fa-solid fa-file text-emerald-400"></i> कुल ${order.totalPages || 1} पेज
                </span>
                <span class="bg-emerald-500/10 text-emerald-300 px-2.5 py-1 rounded-md font-bold border border-emerald-500/20">
                  कुल राशि: ₹${order.totalAmount}
                </span>
              </div>

              <!-- Uploaded Files List -->
              <div class="pt-2">
                <p class="text-[11px] uppercase font-bold text-slate-400 mb-1">अपलोड की गई फाइल्स (${filesList.length}):</p>
                <div class="flex flex-wrap gap-2">
                  ${filesList.map((f, i) => `
                    <a href="${f.filePath}" target="_blank" class="text-xs bg-slate-900/80 hover:bg-slate-900 border border-slate-700 text-blue-400 hover:text-blue-300 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-all truncate max-w-[220px]">
                      <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                      <span class="truncate">${i + 1}.${f.originalName}</span>
                    </a>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-2.5 w-full md:w-auto shrink-0">
              <button onclick="printDirect('${order.orderId}', this)" 
                class="w-full sm:w-auto px-5 py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-print"></i>
                <span>सब फाइल्स प्रिंट करें</span>
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    // Print Direct Handler (Sends command to all files via backend)
    async function printDirect(orderId, btn) {
      const originalContent = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> प्रिंट भेजा जा रहा है...`;

      try {
        const res = await fetch('/api/print-direct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId })
        });
        const data = await res.json();

        if (data.success) {
          alert("✅ " + data.message);
          fetchOrders();
        } else {
          alert("❌ त्रुटि: " + (data.message || "प्रिंट नहीं हो सका"));
        }
      } catch (err) {
        alert("❌ प्रिंटर से कनेक्ट नहीं हो सका। सुनिश्चित करें कि Node.js सर्वर प्रिंटर सिस्टम पर चालू है!");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalContent;
      }
    }

    // Socket Real-time Event Listeners
    socket.on('new-order', (newOrder) => {
      allOrders.unshift(newOrder);
      renderOrders(allOrders);
    });

    socket.on('order-status-changed', (updatedOrder) => {
      const idx = allOrders.findIndex(o => o.orderId === updatedOrder.orderId);
      if (idx !== -1) {
        allOrders[idx] = updatedOrder;
        renderOrders(allOrders);
      }
    });

    // Initial load
    fetchOrders();
  </script>

</body>
</html>
