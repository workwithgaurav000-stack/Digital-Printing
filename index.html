<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Print Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- PDF Page Count Calculation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 p-6 md:p-8">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner">
        <i class="fa-solid fa-print text-3xl"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Smart Print Express</h1>
      <p class="text-xs text-slate-500 mt-1">बिना व्हाट्सएप/नंबर शेयर किए तुरंत प्रिंट निकालें 🔒</p>
    </div>

    <form id="uploadForm" class="space-y-4">
      
      <!-- Customer Name -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">आपका नाम</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-user"></i>
          </span>
          <input type="text" id="customerName" required placeholder="उदा. राहुल कुमार" 
            class="w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm text-slate-800 placeholder-slate-400 transition-all">
        </div>
      </div>

      <!-- File Upload Field -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">फाइल चुनें (PDF / Photo - Multiple)</label>
        <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 transition-all bg-slate-50 relative overflow-hidden">
          <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-2">
            <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-500 mb-1" id="uploadIcon"></i>
            <p class="text-xs text-slate-700 font-semibold truncate max-w-[280px]" id="fileNameDisplay">यहाँ टैप करके फाइल्स अपलोड करें</p>
            <p class="text-[10px] text-slate-400 mt-0.5" id="fileInfoDisplay">PDF, PNG, JPG (एक से अधिक फाइल्स चुनें)</p>
          </div>
          <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" multiple required class="hidden">
        </label>
      </div>

      <!-- Print Options -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">प्रिंट रंग</label>
          <select id="printType" class="w-full px-3 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium text-slate-800">
            <option value="BW">B&W (₹2/पेज)</option>
            <option value="Color">Color (₹10/पेज)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">साइड्स (Sides)</label>
          <select id="sides" class="w-full px-3 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium text-slate-800">
            <option value="Single">Single Sided</option>
            <option value="Double">Double Sided</option>
          </select>
        </div>
      </div>

      <!-- Copies Field -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">कॉपियों की संख्या</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-copy"></i>
          </span>
          <input type="number" id="copies" value="1" min="1" required 
            class="w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-semibold text-slate-800">
        </div>
      </div>

      <!-- Estimated Price Badge -->
      <div id="priceCard" class="hidden bg-blue-50/80 border border-blue-200 rounded-2xl p-3 flex justify-between items-center text-xs font-bold text-blue-900">
        <span class="flex items-center gap-1.5 text-blue-700">
          <i class="fa-solid fa-calculator text-blue-500"></i> कुल अनुमानित मूल्य:
        </span>
        <span class="text-base text-blue-600 font-extrabold" id="totalPriceTag">₹0</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 text-sm mt-2">
        <span>प्रिंट टोकन जनरेट करें</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

    </form>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const fileInfoDisplay = document.getElementById('fileInfoDisplay');
    const uploadIcon = document.getElementById('uploadIcon');
    const printType = document.getElementById('printType');
    const copiesInput = document.getElementById('copies');
    const totalPriceTag = document.getElementById('totalPriceTag');
    const priceCard = document.getElementById('priceCard');

    let totalPagesCount = 0;

    // Handle Multiple Files & Count Pages
    fileInput.addEventListener('change', async (e) => {
      const files = e.target.files;
      if (files.length > 0) {
        uploadIcon.className = "fa-solid fa-file-circle-check text-3xl text-emerald-500 mb-1";
        
        if (files.length === 1) {
          fileNameDisplay.innerText = files[0].name;
        } else {
          fileNameDisplay.innerText = `कुल ${files.length} फाइल्स चुनी गईं`;
        }
        fileNameDisplay.classList.add('text-blue-600', 'font-bold');

        totalPagesCount = 0;

        for (let file of files) {
          if (file.type === "application/pdf") {
            try {
              const arrayBuffer = await file.arrayBuffer();
              const pdf = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
              totalPagesCount += pdf.getPageCount();
            } catch (err) {
              totalPagesCount += 1;
            }
          } else {
            totalPagesCount += 1;
          }
        }

        fileInfoDisplay.innerText = `कुल पेजों की संख्या: ${totalPagesCount}`;
        calculatePrice();
      }
    });

    function calculatePrice() {
      if (!fileInput.files.length) return;
      const rate = printType.value === 'BW' ? 2 : 10;
      const copies = parseInt(copiesInput.value) || 1;
      const total = totalPagesCount * rate * copies;
      
      totalPriceTag.innerText = `₹${total}`;
      priceCard.classList.remove('hidden');
    }

    printType.addEventListener('change', calculatePrice);
    copiesInput.addEventListener('input', calculatePrice);

    // Form Submit Logic
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> अपलोड हो रहा है...`;

      const formData = new FormData();
      const selectedRate = printType.value === 'BW' ? 2 : 10;

      formData.append('customerName', document.getElementById('customerName').value.trim());
      
      // Append all files in loop
      for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('files', fileInput.files[i]);
      }

      formData.append('printType', printType.value);
      formData.append('sides', document.getElementById('sides').value);
      formData.append('copies', copiesInput.value);
      formData.append('ratePerPage', selectedRate);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('currentOrder', JSON.stringify(data.order));
          window.location.href = '/receipt.html';
        } else {
          alert("त्रुटि: " + (data.message || "फाइल अपलोड नहीं हो सकी"));
          submitBtn.disabled = false;
          submitBtn.innerHTML = `प्रिंट टोकन जनरेट करें <i class="fa-solid fa-arrow-right"></i>`;
        }
      } catch (err) {
        alert("सर्वर से कनेक्ट नहीं हो पाया। सुनिश्चित करें कि Node.js सर्वर चालू है!");
        submitBtn.disabled = false;
        submitBtn.innerHTML = `प्रिंट टोकन जनरेट करें <i class="fa-solid fa-arrow-right"></i>`;
      }
    });
  </script>

</body>
</html>
